name: CI/CD backend-api cicd test with deploy server

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/backend-api-image:${{ github.run_number }} 

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test   

  build-and-push:
    
    needs: test
    
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3 
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}  
     
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}

  
  deploy-job:

    runs-on: ubuntu-latest

    needs: build-and-push  

    steps:

      - name: Connect to the VPS using SSH
        uses: appleboy/ssh-action@master # master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |

              # Pull the latest Docker image
              sudo docker pull ${{ env.IMAGE_NAME }}
              
              # Remove the old container if it exists
              sudo docker rm -f backend-api 

              sudo docker run -d \
              -p 127.0.0.1:3001:3001 \
              --name backend-api \
              --network backend-api-net \
              -e MONGO_URI=mongodb://root:pass-123@mongodb:27017/book-store?authSource=admin \
              --restart always \
              ${{ env.IMAGE_NAME }}


              # Shows running containersss
              sudo docker ps 



 