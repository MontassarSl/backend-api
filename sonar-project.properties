sonar.projectKey=MontassarSl_backend-api
sonar.organization=montassarsl
# sonar.host.url=https://sonarcloud.io
sonar.projectName=Backend API
sonar.projectVersion=1.0
sonar.sources=.
sonar.language=js
sonar.sourceEncoding=UTF-8

# Code source et tests séparés
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,**/*.test.js,**/*.spec.js
sonar.tests=.
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Couverture Jest (à générer avant le scan)
sonar.javascript.lcov.reportPaths=coverage/lcov.info